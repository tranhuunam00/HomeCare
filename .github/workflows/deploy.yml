name: Deploy HomeCare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            # Source user profiles and NVM to load node/npm/pm2 into the shell environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Source bash profile for general node installations (e.g. if installed via n/nvm/fnm/apt)
            [ -f "$HOME/.profile" ] && source "$HOME/.profile"
            [ -f "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            
            # Go to the repository directory on the server
            cd HomeCare || { echo "Directory not found!"; exit 1; }
            
            echo "=== Pulling latest changes from git ==="
            # Server chỉ để deploy: đưa mã nguồn về ĐÚNG bản trên origin/main.
            # (git pull từng bị chặn vì npm install trên server sửa package-lock.json.)
            # reset --hard chỉ đụng file được git theo dõi; .env, node_modules, dist... không bị ảnh hưởng.
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            
            echo "=== Navigating to homecare_fe ==="
            cd homecare_fe || { echo "homecare_fe directory not found!"; exit 1; }
            
            echo "=== Installing frontend dependencies ==="
            # npm ci cài đúng theo package-lock.json và KHÔNG sửa lockfile; lock lệch package.json thì mới dùng install
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            # Giữ cây git sạch cho lần deploy sau
            git checkout -- package-lock.json || true
            
            echo "=== Building frontend ==="
            npm run build
            
            echo "=== Reloading PM2 process ==="
            # Reload if process exists, otherwise start the PM2 service
            pm2 reload fe-homecare || pm2 start serve --name fe-homecare -- -s dist -l 3000
            
            echo "=== Deployment Completed Successfully! ==="
